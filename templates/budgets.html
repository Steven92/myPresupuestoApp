<!DOCTYPE html>
<html>
<head>
    <title>Gestionar Presupuestos</title>
</head>
<body>
    <h2>Gestionar Presupuestos</h2>
    <p>Establece tus límites de presupuesto para cada categoría (en Pesos Colombianos - COP).</p>
    <form method="POST">
        {% for category in categories %}
        <div>
            <label for="{{ category|slugify }}">{{ category }}:</label>
            <input type="number" step="0.01" id="{{ category|slugify }}" name="{{ category }}" value="{{ budgets.get(category, '') }}">
        </div>
        {% endfor %}
        <br>
        <button type="submit">Guardar Presupuestos</button>
    </form>
    <p><a href="{{ url_for('dashboard') }}">Volver al Panel</a></p>
</body>
</html>
