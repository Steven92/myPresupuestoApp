<!DOCTYPE html>
<html>
<head>
    <title>Iniciar Sesión</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script>
        // Configure your Firebase configuration object here
        const firebaseConfig = {
            apiKey: "",
            authDomain: "mypresupuestoapp.firebaseapp.com",
            projectId: "mypresupuestoapp",
            storageBucket: "mypresupuestoapp.firebasestorage.app",
            messagingSenderId: "",
            appId: "",
            measurementId: "G-"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        function login() {
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const idTokenInput = document.getElementById('idToken');
            const loginForm = document.getElementById('loginForm');
            const errorDiv = document.getElementById('error');

            auth.signInWithEmailAndPassword(emailInput.value, passwordInput.value)
                .then((userCredential) => {
                    // Usuario ha iniciado sesión exitosamente
                    return userCredential.user.getIdToken();
                })
                .then((idToken) => {
                    // Establece el ID token en el campo oculto del formulario
                    idTokenInput.value = idToken;
                    // Envía el formulario
                    loginForm.submit();
                })
                .catch((error) => {
                    let errorMessage = '';
                    if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                        errorMessage = 'Correo electrónico o contraseña incorrectos.';
                    } else {
                        errorMessage = 'Ocurrió un error al iniciar sesión: ' + error.message;
                    }
                    errorDiv.innerText = errorMessage;
                });
        }

        function sendPasswordResetEmail() {
            const email = document.getElementById('resetEmail').value;
            auth.sendPasswordResetEmail(email)
                .then(() => {
                    alert('Se ha enviado un correo electrónico a ' + email + ' para restablecer tu contraseña. Por favor, revisa tu bandeja de entrada (y la carpeta de spam).');
                    document.getElementById('resetForm').style.display='none'; // Hide the form after sending
                })
                .catch((error) => {
                    const errorCode = error.code;
                    const errorMessage = error.message;
                    alert('Error al enviar el correo de restablecimiento: ' + errorMessage);
                });
        }

        function showResetForm() {
            document.getElementById('resetForm').style.display='block';
        }

        function hideResetForm() {
            document.getElementById('resetForm').style.display='none';
        }
    </script>
</head>
<body>
    <h2>Iniciar Sesión</h2>
    <p id="error" style="color: red;"></p>
    <form id="loginForm" method="POST" onsubmit="login(); return false;">
        <label for="email">Correo Electrónico:</label><br>
        <input type="email" id="email" name="email" required><br><br>
        <label for="password">Contraseña:</label><br>
        <input type="password" id="password" name="password" required><br><br>
        <input type="hidden" id="idToken" name="idToken" value="">
        <button type="submit">Iniciar Sesión</button>
    </form>
    <p>¿Olvidaste tu contraseña? <a href="#" onclick="showResetForm()">Restablecer aquí</a></p>

    <div id="resetForm" style="display:none;">
        <h3>Restablecer Contraseña</h3>
        <label for="resetEmail">Correo Electrónico:</label><br>
        <input type="email" id="resetEmail" required><br><br>
        <button type="button" onclick="sendPasswordResetEmail()">Enviar Correo de Restablecimiento</button>
        <button type="button" onclick="hideResetForm()">Cancelar</button>
    </div>

    <p>¿No tienes una cuenta? <a href="{{ url_for('register') }}">Regístrate aquí</a></p>
</body>
</html>
