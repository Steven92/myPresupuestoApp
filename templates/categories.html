<!DOCTYPE html>
<html>
<head>
    <title>Gestionar Categorías</title>
</head>
<body>
    <h2>Gestionar Categorías</h2>

    <h3>Tus Categorías Personalizadas</h3>
    {% if user_categories %}
    <ul>
        {% for category in user_categories %}
        <li>
            {{ category }}
            <a href="{{ url_for('edit_category', category_name=category) }}">Editar</a>
            <form method="POST" action="{{ url_for('delete_category', category_name=category) }}" style="display:inline;">
                <button type="submit" onclick="return confirm('¿Estás seguro de que quieres eliminar esta categoría?')">Eliminar</button>
            </form>
        </li>
        {% endfor %}
    </ul>
    {% else %}
    <p>No has agregado ninguna categoría personalizada aún.</p>
    {% endif %}

    <h3>Agregar Nueva Categoría</h3>
    <form method="POST" action="{{ url_for('add_category') }}">
        <label for="new_category">Nueva Categoría:</label><br>
        <input type="text" id="new_category" name="new_category" required><br><br>
        <button type="submit">Agregar Categoría</button>
    </form>

    <p><a href="{{ url_for('dashboard') }}">Volver al Panel</a></p>
</body>
</html>
